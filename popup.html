<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenGrabber</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            width: 260px;
            margin: 0;
            padding: 14px;
            background: #f7f7f9;
            color: #111;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 10px;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
        }

        button {
            padding: 8px 12px;
            border: 0;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        #startButton {
            background: #2e7d32;
            color: #fff;
        }

        #stopButton {
            background: #c62828;
            color: #fff;
        }

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px;
        }

        .label {
            color: #555;
            font-size: 12px;
        }

        .value {
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <h1>ScreenGrabber</h1>
    <div class="row">
        <button id="startButton" type="button">Start</button>
        <button id="stopButton" type="button">Stop</button>
    </div>
    <div class="card">
        <div class="label">Status</div>
        <div id="status" class="value">Idle</div>
    </div>
    <div class="card" style="margin-top:8px;">
        <div class="label">Next screenshot in</div>
        <div id="countdown" class="value">--:--</div>
    </div>
    <div class="card" style="margin-top:8px;">
        <div class="label">Screenshots taken</div>
        <div id="screenshotCount" class="value">0</div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
